name: sense

services:
  sensevoice:
    container_name: sensevoice
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODELSCOPE_CACHE: /models
      SENSEVOICE_DEVICE: ${SENSEVOICE_DEVICE:-auto}
      SENSEVOICE_MODEL: ${SENSEVOICE_MODEL:-iic/SenseVoiceSmall}
      SENSEVOICE_VAD_MODEL: ${SENSEVOICE_VAD_MODEL:-fsmn-vad}
      SENSEVOICE_PUNC_MODEL: ${SENSEVOICE_PUNC_MODEL:-iic/punc_ct-transformer_zh-cn-common-vocab272727-pytorch}
      SENSEVOICE_SPK_MODEL: ${SENSEVOICE_SPK_MODEL:-cam++}
      SENSEVOICE_SPK_MODE: ${SENSEVOICE_SPK_MODE:-vad_segment}
      SENSEVOICE_VAD_MAX_SEGMENT_MS: ${SENSEVOICE_VAD_MAX_SEGMENT_MS:-30000}
      SENSEVOICE_VAD_CHUNK_MS: ${SENSEVOICE_VAD_CHUNK_MS:-60}
      SENSEVOICE_MAX_AUDIO_BYTES: ${SENSEVOICE_MAX_AUDIO_BYTES:-20971520}
      SENSEVOICE_MAX_UTTERANCE_SECONDS: ${SENSEVOICE_MAX_UTTERANCE_SECONDS:-30}
      SENSEVOICE_MAX_HISTORY_TURNS: ${SENSEVOICE_MAX_HISTORY_TURNS:-10}
      SENSEVOICE_SKIP_STARTUP_WARMUP: ${SENSEVOICE_SKIP_STARTUP_WARMUP:-0}
      SENSEVOICE_API_KEY: ${SENSEVOICE_API_KEY:-}
      SENSEVOICE_ALLOWED_ORIGINS: ${SENSEVOICE_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      SENSEVOICE_STREAM_QUEUE_SIZE: ${SENSEVOICE_STREAM_QUEUE_SIZE:-8}
      SENSEVOICE_TTS_QUEUE_SIZE: ${SENSEVOICE_TTS_QUEUE_SIZE:-4}
      SENSEVOICE_TTS_QUEUE_MAX_SECONDS: ${SENSEVOICE_TTS_QUEUE_MAX_SECONDS:-30}
      SENSEVOICE_TTS_ESTIMATED_CHARS_PER_SECOND: ${SENSEVOICE_TTS_ESTIMATED_CHARS_PER_SECOND:-12}
      SENSEVOICE_MAX_VOICEPRINT_AUDIO_BYTES: ${SENSEVOICE_MAX_VOICEPRINT_AUDIO_BYTES:-20971520}
      SENSEVOICE_BUILD_VERSION: ${SENSEVOICE_BUILD_VERSION:-development}
      SENSEVOICE_MODEL_REVISION: ${SENSEVOICE_MODEL_REVISION:-master}
      SENSEVOICE_VAD_MODEL_REVISION: ${SENSEVOICE_VAD_MODEL_REVISION:-master}
      SENSEVOICE_PUNC_MODEL_REVISION: ${SENSEVOICE_PUNC_MODEL_REVISION:-master}
      SENSEVOICE_SPK_MODEL_REVISION: ${SENSEVOICE_SPK_MODEL_REVISION:-master}
      SENSEVOICE_VOICEPRINT_ADMIN_KEY: ${SENSEVOICE_VOICEPRINT_ADMIN_KEY:-}
      SENSEVOICE_VOICEPRINT_KEY: ${SENSEVOICE_VOICEPRINT_KEY:-}
      SENSEVOICE_VOICEPRINT_SESSION_KEY: ${SENSEVOICE_VOICEPRINT_SESSION_KEY:-}
      SENSEVOICE_VOICEPRINT_PATH: ${SENSEVOICE_VOICEPRINT_PATH:-/data/voice-stack/data/voiceprints}
      SENSEVOICE_VOICEPRINT_THRESHOLD: ${SENSEVOICE_VOICEPRINT_THRESHOLD:-0.72}
      SENSEVOICE_VOICEPRINT_MARGIN: ${SENSEVOICE_VOICEPRINT_MARGIN:-0.04}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_CHAT_COMPLETIONS_URL: ${LLM_CHAT_COMPLETIONS_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_SYSTEM_PROMPT: ${LLM_SYSTEM_PROMPT:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      SENSEVOICE_MAX_LLM_OUTPUT_CHARS: ${SENSEVOICE_MAX_LLM_OUTPUT_CHARS:-12000}
      GPT_SOVITS_BASE_URL: ${GPT_SOVITS_BASE_URL:-}
      GPT_SOVITS_REF_AUDIO_PATH: ${GPT_SOVITS_REF_AUDIO_PATH:-}
      GPT_SOVITS_PROMPT_TEXT: ${GPT_SOVITS_PROMPT_TEXT:-}
      GPT_SOVITS_PROMPT_LANG: ${GPT_SOVITS_PROMPT_LANG:-}
      GPT_SOVITS_TEXT_LANG: ${GPT_SOVITS_TEXT_LANG:-auto}
      GPT_SOVITS_STREAMING_MODE: ${GPT_SOVITS_STREAMING_MODE:-3}
      GPT_SOVITS_SPEED_FACTOR: ${GPT_SOVITS_SPEED_FACTOR:-1.0}
      GPT_SOVITS_TIMEOUT_SECONDS: ${GPT_SOVITS_TIMEOUT_SECONDS:-90}
      GPT_SOVITS_DEFAULT_VOICE_ID: ${GPT_SOVITS_DEFAULT_VOICE_ID:-assistant_default}
      GPT_SOVITS_DEFAULT_VOICE_NAME: ${GPT_SOVITS_DEFAULT_VOICE_NAME:-默认助手音色}
      SENSEVOICE_VOICE_PROFILE_FILE: ${SENSEVOICE_VOICE_PROFILE_FILE:-}
    volumes:
      - sensevoice-models:/models
      - sensevoice-voiceprints:/data/voice-stack/data/voiceprints
    ports:
      - "50000:50000"
    restart: on-failure:5
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    gpus: all

volumes:
  sensevoice-models:
  sensevoice-voiceprints:
